    <h3>Formulário do CESAE</h3>
    <form action="process_form.php" method="post">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name"  placeholder="Insira seu nome aqui" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="gender">Género:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Masculino</label><br>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Feminino</label><br><br>

        <label for="date">Data Atual</label>
        <input type="date" id="date" name="date" required><br>

        <label option for="turma">Turma:</label>
        <select id="turma" name="turma" required>
            <option value="">Selecione uma turma</option>
            <option value="1a">Software Developer 2026</option>
            <option value="1b">Data Science 2026</option>
        </select><br><br>

        <label for="message">Mensagem:</label>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar">
