<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
<body>
<!--Criar uma grid com as seguintes características: ​
Uma row com um bloco de 6 colunas em ecrã do pc com o vosso nome, que em ecras pequenos abranja 12 colunas. Cor de background: a vossa preferida das cores bootstrap  (que não verde).​
Uma row com um bloco central que abranja 8 colunas com a seguinte frase: "eu serei um génio da programação" ao centro da coluna, background verde.​ -->
    <div class="container my-4 text-white text-center">
        <!-- row 1 -->
        <div class="row"> <!-- uma row com um bloco de 6 colunas, que em ecras pequenos abranja 12 colunas. -->
            <div class="col-sm-6 bg-warning p-3 mx-auto">
                Dayane Parada
            </div>
        </div>

        <!-- row 2 -->
        <div class="row my-4"> <!-- margin-top = 4 -->
            <div class="col-8 bg-success p-3 mx-auto"><!-- bloco de 8 colunas -->
            💡 eu serei um génio da programação!!! 💡
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>     
</body>
</html>
